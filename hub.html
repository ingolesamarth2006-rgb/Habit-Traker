<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Growth Hub</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="hub.css"
  >
</head>


<body>


  <!-- =====================================================
       BACKGROUND
  ====================================================== -->

  <div class="hub-background">

    <div class="hub-bg-image"></div>

    <div class="hub-overlay"></div>

    <div class="hub-depth-glow"></div>

  </div>



  <!-- =====================================================
       FLOATING STONES HUB
  ====================================================== -->

  <main
    class="growth-universe"
    id="growthUniverse"
  >


    <!-- ==================================================
         MIND STONE
         STUDIES
    =================================================== -->

    <button
      class="stone-portal stone-mind"
      data-target="studies.html"
      type="button"
    >

      <span class="stone-aura"></span>

      <img
        class="stone-image"
        src="stones/mind.png"
        alt="Studies"
      >

      <span class="stone-name">
        STUDIES
      </span>

    </button>



    <!-- ==================================================
         SPACE STONE
         RESOURCES
    =================================================== -->

    <button
      class="stone-portal stone-space"
      data-target="resources.html"
      type="button"
    >

      <span class="stone-aura"></span>

      <img
        class="stone-image"
        src="stones/space.png"
        alt="Resources"
      >

      <span class="stone-name">
        RESOURCES
      </span>

    </button>



    <!-- ==================================================
         REALITY STONE
         COMMUNICATION
    =================================================== -->

    <button
      class="stone-portal stone-reality"
      data-target="communication.html"
      type="button"
    >

      <span class="stone-aura"></span>

      <img
        class="stone-image"
        src="stones/reality.png"
        alt="Communication"
      >

      <span class="stone-name">
        COMMUNICATION
      </span>

    </button>



    <!-- ==================================================
         POWER STONE
         PROJECTS
    =================================================== -->

    <button
      class="stone-portal stone-power"
      data-target="projects.html"
      type="button"
    >

      <span class="stone-aura"></span>

      <img
        class="stone-image"
        src="stones/power.png"
        alt="Projects"
      >

      <span class="stone-name">
        PROJECTS
      </span>

    </button>



    <!-- ==================================================
         TIME STONE
         HABIT TRACKER
    =================================================== -->

    <button
      class="stone-portal stone-time"
      data-target="body.html"
      type="button"
    >

      <span class="stone-aura"></span>

      <img
        class="stone-image"
        src="stones/time.png"
        alt="Habit Tracker"
      >

      <span class="stone-name">
        HABIT TRACKER
      </span>

    </button>



    <!-- ==================================================
         SOUL STONE
         JOURNAL
    =================================================== -->

    <button
      class="stone-portal stone-soul"
      data-target="journal.html"
      type="button"
    >

      <span class="stone-aura"></span>

      <img
        class="stone-image"
        src="stones/soul.png"
        alt="Journal"
      >

      <span class="stone-name">
        JOURNAL
      </span>

    </button>


  </main>



  <script src="hub.js"></script>


</body>

</html>
